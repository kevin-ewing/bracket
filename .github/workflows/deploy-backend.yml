name: Deploy score backend

# Optional: runs only when explicitly started after Cloudflare setup.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bracket-score-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: leaderboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check optional backend setup
        id: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-backend.mjs
      - name: Test game and backend
        if: steps.backend.outputs.ready == 'true'
        run: npm test
      - name: Initialize database and deploy API
        if: steps.backend.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: leaderboard
          command: |
            d1 execute bracket-scores --remote --file=schema.sql
            deploy
